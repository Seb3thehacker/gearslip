name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Write signing key and properties
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > gearslip-release.jks
          cat > keystore.properties <<EOF
          storeFile=gearslip-release.jks
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        run: ./gradlew :gearslip:assembleRelease

      - name: Locate APK
        id: apk
        run: |
          apk=$(find gearslip/build/outputs/apk/release -name "*.apk" | head -n1)
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
