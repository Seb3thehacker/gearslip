# Gearslip's opt-in usage notes. Deploy with `npx wrangler deploy` from this folder.
# Setup, once:
#   npx wrangler d1 create gearslip-stats          (paste the id it prints below)
#   npx wrangler d1 execute gearslip-stats --remote --file schema.sql
#   npx wrangler secret put SALT                    (any long random string; keep it)
#   npx wrangler secret put DASHBOARD_KEY           (the key for the dashboard link)
name = "gearslip-stats"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "gearslip-stats"
database_id = "201521a7-0b4a-4fff-ab11-d575b821528a"

# The public repo whose release downloads the dashboard compares against. If GitHub starts
# refusing (60 requests an hour without a token), add one: npx wrangler secret put GITHUB_TOKEN
[vars]
GITHUB_REPO = "Seb3thehacker/gearslip"

# Save the download counts once a day, so the dashboard can show downloads per day.
[triggers]
crons = ["17 6 * * *"]
